<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Team3 Demand Gen</title>
<style>
@font-face { font-family: Heebo; font-weight: 300; src: url(node_modules/@fontsource/heebo/files/heebo-hebrew-300-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: Heebo; font-weight: 500; src: url(node_modules/@fontsource/heebo/files/heebo-hebrew-500-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: Heebo; font-weight: 800; src: url(node_modules/@fontsource/heebo/files/heebo-hebrew-800-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: Heebo; font-weight: 900; src: url(node_modules/@fontsource/heebo/files/heebo-hebrew-900-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: Heebo; font-weight: 300; src: url(node_modules/@fontsource/heebo/files/heebo-latin-300-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2122; }
@font-face { font-family: Heebo; font-weight: 500; src: url(node_modules/@fontsource/heebo/files/heebo-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2122; }
@font-face { font-family: Heebo; font-weight: 800; src: url(node_modules/@fontsource/heebo/files/heebo-latin-800-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2122; }
@font-face { font-family: Heebo; font-weight: 900; src: url(node_modules/@fontsource/heebo/files/heebo-latin-900-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2122; }

:root {
  --ink: #04070c;
  --navy: #071322;
  --bp: #5fd4ff;        /* blueprint cyan */
  --bp-dim: rgba(95, 212, 255, .28);
  --alert: #ff2b3a;
  --amber: #ffb627;
  --white: #f4f8fc;
  --u: 10.8px;          /* 1% of the short side; set from JS */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; overflow: hidden; }
body { font-family: Heebo, sans-serif; color: var(--white); }
#stage { position: relative; overflow: hidden; background: var(--ink); }
#world { position: absolute; inset: 0; will-change: transform; }
.scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
.layer { position: absolute; inset: 0; }

/* blueprint grid backdrop */
.grid {
  position: absolute; inset: -10%;
  background-color: var(--navy);
  background-image:
    linear-gradient(rgba(95,212,255,.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(95,212,255,.10) 1px, transparent 1px),
    linear-gradient(rgba(95,212,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(95,212,255,.045) 1px, transparent 1px);
  background-size: calc(var(--u)*12) calc(var(--u)*12), calc(var(--u)*12) calc(var(--u)*12), calc(var(--u)*2.4) calc(var(--u)*2.4), calc(var(--u)*2.4) calc(var(--u)*2.4);
}
svg { position: absolute; overflow: visible; }
.bp line, .bp path, .bp rect, .bp polyline, .bp circle, .bp polygon { vector-effect: non-scaling-stroke; }
.ln { fill: none; stroke: var(--bp); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ln.thin { stroke-width: 1; stroke: var(--bp-dim); }
.ln.dash { stroke-dasharray: 6 6; }
.svgtxt { font-family: Heebo; font-weight: 500; fill: var(--bp); letter-spacing: .08em; }

/* photos */
.photo { position: absolute; inset: 0; overflow: hidden; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%;
  filter: contrast(1.18) saturate(.78) brightness(.82); }
.photo::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(4,12,24,.55) 0%, rgba(4,12,24,0) 35%, rgba(4,12,24,.15) 60%, rgba(2,6,12,.85) 100%),
              linear-gradient(90deg, rgba(0,60,90,.25), rgba(255,140,40,.06)); mix-blend-mode: normal; }
.scene.missing .photo { display: none; }
#s6b img { object-position: 50% 15%; transform-origin: 50% 15%; }
#s5p { left: auto; width: 46%; border-left: 2px solid var(--amber); -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%); }
.vert #s5p img { object-position: 50% 0%; transform-origin: 50% 0%; }
.vert #s5p { left: 0; width: auto; bottom: auto; height: 58%; border-left: 0; border-bottom: 2px solid var(--amber); -webkit-mask-image: linear-gradient(0deg, transparent, #000 12%); }
.scene:not(.missing) .fallback { display: none; }

/* kinetic type */
.kt { position: absolute; left: 0; right: 0; direction: rtl; text-align: center; font-family: Heebo; line-height: 1.02; }
.kt .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
.h1 { font-weight: 900; font-size: calc(var(--u)*9.2); letter-spacing: -.01em; text-shadow: 0 0 calc(var(--u)*3) rgba(0,0,0,.6); }
.h2 { font-weight: 800; font-size: calc(var(--u)*6.4); text-shadow: 0 0 calc(var(--u)*2) rgba(0,0,0,.7); }
.h3 { font-weight: 500; font-size: calc(var(--u)*3.6); letter-spacing: .01em; text-shadow: 0 0 calc(var(--u)*1.5) rgba(0,0,0,.8); }
.cy { color: var(--bp); }
.rd { color: var(--alert); }
.am { color: var(--amber); }
.outline { color: transparent; -webkit-text-stroke: calc(var(--u)*.18) var(--white); }

/* HUD */
.hud { position: absolute; font-family: Heebo; font-weight: 500; letter-spacing: .14em; font-size: calc(var(--u)*1.6); color: var(--white); }
.chip { display: inline-flex; align-items: center; gap: calc(var(--u)*.8); padding: calc(var(--u)*.6) calc(var(--u)*1.2);
  border: 1px solid rgba(255,255,255,.35); background: rgba(4,10,20,.55); backdrop-filter: blur(4px); direction: rtl; font-family: Heebo; letter-spacing: .02em; }
.dot { width: calc(var(--u)*1.1); height: calc(var(--u)*1.1); border-radius: 50%; background: var(--alert); box-shadow: 0 0 calc(var(--u)*1) var(--alert); }
.corner { position: absolute; width: calc(var(--u)*5); height: calc(var(--u)*5); border: 0 solid rgba(255,255,255,.75); }

/* global finishing */
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
#redwash { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(255,30,50,.0) 20%, rgba(255,20,40,.55) 100%); opacity: 0; }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.72) 100%); pointer-events: none; }
#grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .10; mix-blend-mode: overlay; pointer-events: none; image-rendering: pixelated; }
#streak { position: absolute; left: -20%; right: -20%; height: calc(var(--u)*.35); top: 50%; opacity: 0;
  background: linear-gradient(90deg, transparent, rgba(95,212,255,.0) 10%, rgba(140,225,255,.9) 50%, rgba(95,212,255,0) 90%, transparent);
  filter: blur(2px); mix-blend-mode: screen; }
.bar { position: absolute; left: 0; right: 0; background: #000; height: 0; z-index: 5; }
#barT { top: 0; } #barB { bottom: 0; }

/* CTA */
.btn { display: inline-block; direction: rtl; font-family: Heebo; font-weight: 800; font-size: calc(var(--u)*4.2);
  padding: calc(var(--u)*1.4) calc(var(--u)*4); background: var(--amber); color: #0a0d12; border-radius: calc(var(--u)*.6);
  box-shadow: 0 0 0 0 rgba(255,182,39,.6); }
.logo { position: relative; height: calc(var(--u)*22); aspect-ratio: 624 / 597; }
.vert .logo { height: calc(var(--u)*30); }
.logo img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 calc(var(--u)*3) rgba(255,182,39,.25)); }
.logo .sweep { position: absolute; inset: 0; overflow: hidden; -webkit-mask: url(assets/logo.png) center / contain no-repeat; }
.logo .sweep i { position: absolute; inset: -20% -60%; background: linear-gradient(100deg, transparent 42%, rgba(255,255,255,.9) 50%, transparent 58%); }
#bug { position: absolute; z-index: 6; height: calc(var(--u)*8); aspect-ratio: 624 / 597; right: 3%; }
#bug img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 calc(var(--u)*1) rgba(0,0,0,.6)); }
</style>
</head>
<body>
<div id="stage">
  <div id="world">

    <!-- S1+S2: technical drawing of a house, 0 - 8s -->
    <section class="scene" id="s1">
      <div class="grid" id="s1grid"></div>
      <svg class="bp" id="house" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="hud" id="s1meta" style="direction:ltr"></div>
    </section>

    <!-- S3: alarm, CCTV feed 8 - 10s -->
    <section class="scene" id="s3">
      <div class="photo"><img data-src="assets/cctv.jpg"></div>
      <div class="fallback layer" style="background:#0b120f">
        <svg class="bp" id="cctvFallback" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" style="inset:0;width:100%;height:100%"></svg>
      </div>
      <div class="layer" id="cctvFx" style="background:repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 2px, transparent 2px 4px); mix-blend-mode:overlay"></div>
    </section>

    <!-- S4: operations center 10 - 14s -->
    <section class="scene" id="s4">
      <div class="photo" id="s4a"><img data-src="assets/moked.jpg"></div>
      <div class="photo" id="s4b"><img data-src="assets/moked2.jpg"></div>
      <div class="fallback layer" style="background:#050b14">
        <svg class="bp" id="mokedFallback" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" style="inset:0;width:100%;height:100%"></svg>
      </div>
    </section>

    <!-- S5: motorcycle patrol 14 - 18s -->
    <section class="scene" id="s5">
      <!-- the route map is always shown; the patrol photo sits beside it as a split-screen panel -->
      <div class="layer" style="background:#050b14">
        <div class="grid"></div>
        <svg class="bp" id="motoFallback" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" style="inset:0;width:100%;height:100%"></svg>
      </div>
      <div class="photo" id="s5p"><img data-src="assets/moto.jpg"></div>
      <div class="layer" id="speedlines"></div>
    </section>

    <!-- S6: patrol officers 18 - 22s -->
    <section class="scene" id="s6">
      <div class="photo" id="s6a"><img data-src="assets/patrol.jpg"></div>
      <div class="photo" id="s6b"><img data-src="assets/patrol2.jpg"></div>
      <div class="fallback layer" style="background:#050b14">
        <div class="grid"></div>
        <svg class="bp" id="mapFallback" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" style="inset:0;width:100%;height:100%"></svg>
      </div>
    </section>

    <!-- S7: proof points 22 - 26s -->
    <section class="scene" id="s7">
      <div class="photo" id="s7a"><img data-src="assets/ops_room.jpg"></div>
      <div class="photo" id="s7b"><img data-src="assets/hq.jpg"></div>
      <div class="fallback layer"><div class="grid"></div></div>
      <div class="layer" style="background:rgba(4,8,16,.62)"></div>
    </section>

    <!-- S8: CTA 26 - 30s -->
    <section class="scene" id="s8">
      <div class="grid" id="s8grid"></div>
      <div class="layer" style="background:radial-gradient(ellipse at 50% 45%, rgba(255,182,39,.16), rgba(4,7,12,.0) 55%), linear-gradient(180deg, rgba(4,7,12,.2), rgba(4,7,12,.85))"></div>
      <svg class="bp" id="ctaLines" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" style="inset:0;width:100%;height:100%"></svg>
    </section>

    <div id="typeLayer" class="layer"></div>
    <div id="hudLayer" class="layer"></div>
  </div>

  <div id="redwash"></div>
  <div id="streak"></div>
  <div id="flash"></div>
  <canvas id="grain"></canvas>
  <div id="vignette"></div>
  <div id="bug"><img src="assets/logo.png" alt="צוות 3"></div>
  <div class="bar" id="barT"></div>
  <div class="bar" id="barB"></div>
</div>

<script>
// ---------------------------------------------------------------------------
// Deterministic composition. window.seek(t) paints the frame at time t (s).
// 120 BPM -> BEAT = .5s. Hits: 8s alarm, 14s drop, 26s logo (see music.py).
// ---------------------------------------------------------------------------
const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1920, H = +Q.get('h') || 1080;
const VERT = H > W;
const DUR = 30, BEAT = 0.5;
const U = Math.min(W, H) / 100;
document.documentElement.style.setProperty('--u', U + 'px');
const stage = document.getElementById('stage');
if (VERT) document.body.classList.add('vert');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';

// ---- math helpers ----------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out3: x => 1 - Math.pow(1 - x, 3),
  out5: x => 1 - Math.pow(1 - x, 5),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inOut3: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  in3: x => x * x * x,
  outBack: x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
};
const lerp = (a, b, x) => a + (b - a) * x;
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// decaying "punch" after a beat hit at time h
const punch = (t, h, len = .35) => (t >= h && t < h + len) ? Math.pow(1 - (t - h) / len, 2) : 0;
const beatPulse = (t, from, to) => (t < from || t >= to) ? 0 : Math.pow(1 - ((t - from) % BEAT) / BEAT, 4);

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function div(cls, html, parent, style = '') {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  if (html != null) d.innerHTML = html;
  if (style) d.style.cssText = style;
  (parent || document.body).appendChild(d);
  return d;
}
// draw-on path: stroke reveal driven by progress
function drawable(node) { node.setAttribute('pathLength', 1); node.style.strokeDasharray = '1 1'; node.style.strokeDashoffset = 1; return node; }
const draw = (node, x) => { node.style.strokeDashoffset = 1 - x; };

// ===========================================================================
// SCENE 1-2: blueprint house elevation
// ===========================================================================
const house = $('#house');
if (VERT) house.setAttribute('viewBox', '20 100 1560 780');
const HL = [];   // [node, start, end]
function hline(d, a, b, cls = 'ln') { const n = drawable(el('path', { d, class: cls }, house)); HL.push([n, a, b]); return n; }

// ground + outline
hline('M60 760 H1540', 0.15, 1.2, 'ln thin');
hline('M300 760 V420 H1000 V760', 0.3, 1.5);
hline('M260 430 L650 210 L1040 430', 0.6, 1.8);                   // roof
hline('M1000 760 V520 H1300 V760', 0.8, 1.9);                    // garage / office wing
hline('M985 528 L1150 450 L1315 528', 1.0, 2.0);
hline('M300 590 H1000', 1.1, 2.0, 'ln thin');                     // slab line
// windows + door
const win = [[360, 470, 120, 90], [540, 470, 120, 90], [760, 470, 160, 90], [360, 640, 120, 90], [760, 640, 120, 90]];
win.forEach(([x, y, w, h], i) => {
  hline(`M${x} ${y} h${w} v${h} h${-w} Z`, 1.3 + i * .12, 2.0 + i * .12);
  hline(`M${x + w / 2} ${y} v${h} M${x} ${y + h / 2} h${w}`, 1.5 + i * .12, 2.2 + i * .12, 'ln thin');
});
hline('M560 760 V630 H660 V760', 1.6, 2.3);                       // door
hline('M1040 760 V600 H1260 V760', 1.7, 2.4);                     // garage door
for (let i = 0; i < 6; i++) hline(`M1040 ${615 + i * 25} H1260`, 1.9 + i * .05, 2.5 + i * .05, 'ln thin');
// fence
for (let i = 0; i < 9; i++) hline(`M${70 + i * 24} 760 V700`, 2.0 + i * .03, 2.4 + i * .03, 'ln thin');
hline('M60 712 H280', 2.1, 2.6, 'ln thin');
for (let i = 0; i < 9; i++) hline(`M${1330 + i * 24} 760 V700`, 2.0 + i * .03, 2.4 + i * .03, 'ln thin');
hline('M1320 712 H1540', 2.1, 2.6, 'ln thin');

// dimension lines with ticks + labels
function dim(x1, y1, x2, y2, label, a, b, vertical) {
  hline(`M${x1} ${y1} L${x2} ${y2}`, a, b, 'ln thin');
  const tk = vertical ? `M${x1 - 10} ${y1} h20 M${x2 - 10} ${y2} h20` : `M${x1} ${y1 - 10} v20 M${x2} ${y2 - 10} v20`;
  hline(tk, a, b, 'ln thin');
  const tx = el('text', { x: (x1 + x2) / 2 + (vertical ? -18 : 0), y: (y1 + y2) / 2 + (vertical ? 0 : -12), class: 'svgtxt', 'font-size': 18, 'text-anchor': 'middle',
    transform: vertical ? `rotate(-90 ${(x1 + x2) / 2 - 18} ${(y1 + y2) / 2})` : '' }, house);
  tx.textContent = label; HL.push([tx, b - .2, b + .2, 'fade']);
}
dim(300, 805, 1000, 805, '14.20 m', 2.2, 2.9);
dim(1000, 805, 1300, 805, '6.10 m', 2.4, 3.0);
dim(240, 760, 240, 430, '6.80 m', 2.3, 3.0, true);
dim(1345, 760, 1345, 520, '4.90 m', 2.5, 3.1, true);

// title block
const tb = el('g', {}, house);
hline('M60 60 H420 V170 H60 Z', 0.4, 1.4, 'ln thin');
hline('M60 100 H420 M240 100 V170', 0.8, 1.6, 'ln thin');
[['TEAM3 · SECURITY LAYOUT', 80, 88, 18], ['DWG  A-101', 80, 140, 16], ['SCALE 1:50', 260, 140, 16], ['REV 03', 80, 162, 13], ['24/7 LINKED', 260, 162, 13]].forEach(([s, x, y, f], i) => {
  const tx = el('text', { x, y, class: 'svgtxt', 'font-size': f }, tb); tx.textContent = s; HL.push([tx, 1.0 + i * .12, 1.4 + i * .12, 'fade']);
});

// security devices (scene 2)
const DEV = [];
function camera(x, y, dir, label, at) {
  const g = el('g', { transform: `translate(${x} ${y})` }, house);
  const cone = el('polygon', { points: dir > 0 ? '0,0 330,-90 330,120' : '0,0 -330,-90 -330,120', fill: 'url(#coneGrad' + (dir > 0 ? 'R' : 'L') + ')', stroke: 'rgba(95,212,255,.5)', 'stroke-width': 1 }, g);
  el('rect', { x: -22, y: -12, width: 44, height: 24, rx: 4, fill: '#071322', stroke: '#5fd4ff', 'stroke-width': 2 }, g);
  el('circle', { cx: dir * 22, cy: 0, r: 7, fill: '#ff2b3a' }, g);
  const tx = el('text', { x: 0, y: -26, class: 'svgtxt', 'font-size': 17, 'text-anchor': 'middle' }, g); tx.textContent = label;
  DEV.push({ g, cone, at, kind: 'cam', dir, x, y });
}
function pir(x, y, label, at) {
  const g = el('g', { transform: `translate(${x} ${y})` }, house);
  const rings = [0, 1, 2].map(() => el('circle', { r: 10, fill: 'none', stroke: '#5fd4ff', 'stroke-width': 2 }, g));
  el('circle', { r: 9, fill: '#5fd4ff' }, g);
  const tx = el('text', { x: 0, y: 34, class: 'svgtxt', 'font-size': 15, 'text-anchor': 'middle' }, g); tx.textContent = label;
  DEV.push({ g, rings, at, kind: 'pir', x, y });
}
function siren(x, y, at) {
  const g = el('g', { transform: `translate(${x} ${y})` }, house);
  el('rect', { x: -20, y: -26, width: 40, height: 52, rx: 6, fill: '#071322', stroke: '#ffb627', 'stroke-width': 2 }, g);
  const waves = [1, 2, 3].map(i => el('path', { d: `M${22 + i * 14} -${12 + i * 7} Q${34 + i * 16} 0 ${22 + i * 14} ${12 + i * 7}`, fill: 'none', stroke: '#ffb627', 'stroke-width': 2 }, g));
  const tx = el('text', { x: 0, y: -36, class: 'svgtxt', 'font-size': 15, 'text-anchor': 'middle', fill: '#ffb627', style: 'fill:#ffb627' }, g); tx.textContent = 'SIREN';
  DEV.push({ g, waves, at, kind: 'siren', x, y });
}
const defs = el('defs', {}, house);
['R', 'L'].forEach(s => {
  const lg = el('linearGradient', { id: 'coneGrad' + s, x1: s === 'R' ? 0 : 1, x2: s === 'R' ? 1 : 0, y1: 0, y2: 0 }, defs);
  el('stop', { offset: 0, 'stop-color': '#5fd4ff', 'stop-opacity': .45 }, lg);
  el('stop', { offset: 1, 'stop-color': '#5fd4ff', 'stop-opacity': 0 }, lg);
});
camera(300, 440, -1, 'CAM-01 · 4K', 4.0);
camera(1000, 440, 1, 'CAM-02 · 4K', 4.5);
camera(1300, 535, 1, 'CAM-03 · IR', 5.0);
camera(560, 620, -1, 'CAM-04 · DOOR', 5.5);
pir(440, 560, 'PIR-01', 6.0);
pir(840, 560, 'PIR-02', 6.25);
pir(840, 700, 'MAG-01', 6.5);
siren(650, 300, 7.0);

function paintType(t) {
  for (const L of LINES) {
    const first = L.ws[0].at;
    const vis = t >= first - .05 && t < L.out + .25;
    L.box.style.display = vis ? '' : 'none';
    if (!vis) continue;
    const o = E.in3(p(t, L.out, L.out + .2));
    for (const w of L.ws) {
      const a = p(t, w.at, w.at + (L.mode === 'slam' ? .18 : .32));
      let tf, op, bl;
      if (L.mode === 'slam') {
        const e = E.outExpo(a);
        tf = `translateY(${(1 - e) * -.12}em) scale(${lerp(1.55, 1, e) + punch(t, w.at + .18, .2) * .03})`;
        op = a > 0 ? clamp(a * 3) : 0; bl = (1 - e) * 14;
      } else {
        const e = E.out5(a);
        tf = `translateY(${(1 - e) * .55}em)`;
        op = e; bl = (1 - e) * 10;
      }
      tf += ` translateY(${-o * .35}em)`;
      w.s.style.transform = tf;
      w.s.style.opacity = op * (1 - o);
      w.s.style.filter = (bl + o * 12) > .3 ? `blur(${bl + o * 12}px)` : 'none';
      w.s.style.letterSpacing = L.mode === 'slam' ? `${(1 - E.out3(a)) * .25}em` : '';
    }
  }
}

    $('#s7a').style.opacity = cut7 ? 0 : 1;
    $('#s7b').style.opacity = cut7 ? 1 : 0;
    kb($('#s7a img'), E.inOut3(p(t, 22, 24)), 1.06, 1.16, 1, -1);
    kb($('#s7b img'), E.inOut3(p(t, 24, 26)), 1.1, 1.2, 0, 0, 1, -1);
  }

  // ---- S8 CTA ----
  const x8 = sceneVis('s8', t);
  if (x8 >= 0) {
    $('#s8grid').style.transform = `scale(${lerp(1.3, 1, E.out5(p(t, 26, 27.5)))})`;
    for (const [n, a, b] of CTA_L) draw(n, E.inOut3(p(t, a, b)));
  }

  // ---- HUD ----
  hideAll(recChip, tsChip, mokedChip, evtFeed, unitChip, miniWrap, cta, ...corners);
  if (t >= 8 && t < 10) {
    recChip.style.opacity = (Math.floor(t * 4) % 2) ? 1 : .35;
    tsChip.style.opacity = 1;
    const sec = 13 + Math.floor((t - 8) * 1);
    const fr = Math.floor((t * 30) % 30);
    tsChip.innerHTML = `<span class="chip" style="direction:ltr">02:47:${two(sec)}:${two(fr)} &nbsp; <b style="color:#ff2b3a">MOTION</b></span>`;
    corners.forEach(c => { c.style.opacity = 1; c.style.borderColor = '#ff2b3a'; });
  }
  if (t >= 10 && t < 14) {
    mokedChip.style.opacity = E.out3(p(t, 10.1, 10.5));
    evtFeed.style.opacity = 1;
    const ev = [[10.5, '02:47:14  ALARM  ZONE 3 · CAM-03', '#ff2b3a'], [11.5, '02:47:16  OPERATOR  VIDEO VERIFIED', '#5fd4ff'], [12.0, '02:47:19  CALL  OWNER NOTIFIED', '#5fd4ff'], [12.5, '02:47:22  DISPATCH  UNIT M-07', '#ffb627']];
    evtFeed.innerHTML = ev.filter(e => t >= e[0]).map(e => `<div style="color:${e[2]}">▸ ${e[1]}</div>`).join('');
    corners.forEach(c => { c.style.opacity = .7; c.style.borderColor = 'rgba(255,255,255,.75)'; });
  }
  if (t >= 14 && t < 18) {
    miniWrap.style.opacity = 0;  // the full-frame route map replaces the mini map
    unitChip.style.opacity = 1;
    unitChip.innerHTML = `<span class="chip" style="direction:ltr"><span class="dot" style="background:#ffb627;box-shadow:0 0 10px #ffb627"></span>UNIT M-07 · EN ROUTE</span>`;
  }
  if (t >= 18 && t < 22) {
    unitChip.style.opacity = 1;
    unitChip.innerHTML = `<span class="chip" style="direction:ltr"><span class="dot" style="background:${t > 21.2 ? '#36d27a' : '#ffb627'};box-shadow:0 0 10px currentColor"></span>${t > 21.2 ? 'UNIT M-07 · ON SITE' : 'UNIT M-07 · EN ROUTE'}</span>`;
  }
  if (t >= 26) {
    cta.style.opacity = 1;
    const a = E.outExpo(p(t, 26, 26.4));
    logo.style.transform = `scale(${lerp(1.8, 1, a)})`; logo.style.opacity = a; logo.style.filter = `blur(${(1 - a) * 18}px)`;
    lightSweep.style.transform = `translateX(${lerp(-120, 120, E.inOut3(p(t, 26.3, 27.3)))}%)`;
    const tg = E.out5(p(t, 26.5, 26.9)); tag.style.opacity = tg; tag.style.transform = `translateY(${(1 - tg) * 30}px)`;
    const b = E.outBack(p(t, 27.5, 27.85)); btn.style.opacity = clamp(b); btn.style.transform = `scale(${lerp(.6, 1, b) + beatPulse(t, 28, 30) * .05})`;
    btn.style.boxShadow = `0 0 0 ${beatPulse(t, 28, 30) * U * 2.4}px rgba(255,182,39,${.45 * beatPulse(t, 28, 30)}), 0 ${U}px ${U * 4}px rgba(255,182,39,.35)`;
    const ua = E.out5(p(t, 28, 28.4)); url.style.opacity = ua; url.style.transform = `translateY(${(1 - ua) * 24}px)`;
  }

  paintType(t);

  // ---- finishing ----
  const fl = punch(t, 8, .18) * .9 + punch(t, 14, .22) * .7 + punch(t, 26, .3) * 1 + punch(t, 10, .12) * .35 + punch(t, 18, .12) * .35 + punch(t, 20, .1) * .3 + punch(t, 22, .12) * .3 + punch(t, 4, .12) * .25;
  $('#flash').style.opacity = fl;
  $('#redwash').style.opacity = (t >= 7.5 && t < 10) ? .35 + .65 * beatPulse(t, 7.5, 10) : 0;
  const st = punch(t, 8, .5) + punch(t, 14, .5) + punch(t, 26, .8) + punch(t, 4, .3) * .5;
  const streak = $('#streak'); streak.style.opacity = clamp(st); streak.style.top = (t >= 26 ? 38 : 50) + '%';
  streak.style.transform = `scaleY(${1 + st * 2})`;
  // letterbox: 2.39:1 bars on 16:9, slimmer on vertical; open fully for the CTA
  const lb = (VERT ? H * .045 : (H - W / 2.1) / 2) * E.inOut3(p(t, 0, 1.2)) * (1 - E.inOut3(p(t, 25.6, 26.2)));
  $('#barT').style.height = $('#barB').style.height = lb + 'px';
  const bug = $('#bug');
  bug.style.top = (lb + (VERT ? H * .02 : H * .025)) + 'px';
  bug.style.opacity = .95 * E.out3(p(t, .6, 1.4)) * (1 - p(t, 25.7, 26));
  gctx.putImageData(GRAINS[Math.floor(t * 24) % GRAINS.length], 0, 0);
  // fade in / out
  $('#stage').style.filter = `brightness(${clamp(p(t, 0, .35) * 1) * (1 - p(t, 29.4, 30))})`;
};

// ---- asset loading: real photos if present, blueprint fallbacks otherwise
window.ready = Promise.all([...document.querySelectorAll('img[data-src]')].map(img => new Promise(res => {
  img.onload = () => res();
  img.onerror = () => { const sc = img.closest('.scene'); const ph = img.closest('.photo'); ph.dataset.missing = 1;
    if (![...sc.querySelectorAll('.photo')].some(p => !p.dataset.missing)) sc.classList.add('missing'); res(); };
  img.src = img.dataset.src;
}))).then(() => document.fonts.ready).then(() => { window.seek(0); return true; });
</script>
</body>
</html>
