  <script>
    const tl = gsap.timeline({ paused: true });
    // hook is on screen from frame 0; the house draws in behind it

    tl.fromTo("#hs-ground", { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 0);
    tl.fromTo("#hs-house", { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: 1.15, ease: "power2.inOut" }, 0.15);
    tl.fromTo("#hs-door", { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 0.9);
    tl.fromTo("#hs-win1", { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: 0.5, ease: "power2.inOut" }, 1.0);
    tl.fromTo("#hs-win2", { strokeDashoffset: 1, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: 0.5, ease: "power2.inOut" }, 1.1);
    tl.fromTo("#hs-sky", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.2);
    tl.fromTo("#hs-stars", { opacity: 0.35 }, { opacity: 1, duration: 0.5, repeat: 5, yoyo: true, ease: "sine.inOut" }, 0.4);
    tl.fromTo("#hs-sensor", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.6);
    // intruder walks to the door
    tl.fromTo("#hs-intruder", { opacity: 0, x: -150 }, { opacity: 1, x: 0, duration: 1.2, ease: "power3.out" }, 2.2);
    // hook leaves word by word
    tl.to("#hs-hook .w", { opacity: 0, filter: "blur(8px)", duration: 0.18, stagger: 0.02, ease: "power3.in" }, 3.1);
    // 3.4 — alarm
    tl.fromTo("#hs-shake", { x: 0, y: 0 }, { keyframes: { x: [10, -9, 7, -5, 3, 0], y: [-6, 8, -5, 3, -1, 0] }, duration: 0.4, ease: "none" }, 3.4);
    tl.fromTo("#hs-flash", { opacity: 0 }, { opacity: 0.6, duration: 0.2, repeat: 11, yoyo: true, ease: "sine.inOut" }, 3.4);
    tl.to("#hs-flash", { opacity: 0, duration: 0.3 }, 6.3);
    tl.fromTo("#hs-badge", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 3.45);

    });

    tl.fromTo("#hs-alarm-s", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 3.95);
    // blur swap into the camera scene
    tl.to("#hs-stage", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 6.55);
    window.__timelines["house"] = tl;
