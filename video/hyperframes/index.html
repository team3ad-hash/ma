<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>צוות 3 – מיגון ומוקד 24/7 (Demand Gen 9:16)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #01051a; }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; container-type: size; }
      #bg { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 35%, #0a1f7a 0%, #020a2e 55%, #01051a 100%); }
      #bg-grid { position: absolute; inset: -10%; background-image: linear-gradient(rgba(34,211,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,255,.07) 1px, transparent 1px); background-size: 6cqmin 6cqmin; }
      #bg-scan { position: absolute; left: 0; right: 0; top: -20%; height: 18cqmin; background: linear-gradient(180deg, transparent, rgba(34,211,255,.08), transparent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22" data-width="1080" data-height="1920">
      <div id="bg" data-layout-ignore><div id="bg-grid"></div><div id="bg-scan"></div></div>

      <div id="house" data-composition-id="house" data-composition-src="compositions/house.html" data-start="0" data-duration="6.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cameras" data-composition-id="cameras" data-composition-src="compositions/cameras.html" data-start="6.8" data-duration="3.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="center" data-composition-id="center" data-composition-src="compositions/center.html" data-start="10.6" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="trust" data-composition-id="trust" data-composition-src="compositions/trust.html" data-start="14.6" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="17.8" data-duration="4.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="brand" data-composition-id="brand" data-composition-src="compositions/brand.html" data-start="0" data-duration="17.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 5"></div>

      <audio id="bed" class="clip" src="assets/audio/bed.wav" data-start="0" data-duration="22" data-track-index="10" data-volume="0.8" data-fade-out="0.8"></audio>
      <audio id="sfx-alarm" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="3.36" data-duration="2.1" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-cut1" class="clip" src="assets/sfx/whoosh.mp3" data-start="6.67" data-duration="0.57" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-notif" class="clip" src="assets/sfx/notification.mp3" data-start="8.6" data-duration="2.45" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-cut2" class="clip" src="assets/sfx/whoosh.mp3" data-start="10.47" data-duration="0.57" data-track-index="12" data-volume="0.35"></audio>
      <audio id="sfx-cut3" class="clip" src="assets/sfx/whoosh.mp3" data-start="14.47" data-duration="0.57" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-pop1" class="clip" src="assets/sfx/pop.mp3" data-start="14.76" data-duration="0.72" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-pop2" class="clip" src="assets/sfx/pop.mp3" data-start="15.16" data-duration="0.72" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-logo" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="16.35" data-duration="2.59" data-track-index="12" data-volume="0.45"></audio>
      <audio id="sfx-btn" class="clip" src="assets/sfx/pop.mp3" data-start="18.66" data-duration="0.72" data-track-index="11" data-volume="0.6"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg-grid", { x: 0, y: 0 }, { x: 132, y: 308, duration: 22, ease: "none" }, 0);
      tl.fromTo("#bg-scan", { yPercent: 0 }, { yPercent: 1200, duration: 3.4, repeat: 5, ease: "none" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
